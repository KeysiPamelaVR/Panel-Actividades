<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <title>Panel de actividades</title>
</head>
<body> 
    <header class="barra">
        <h1>Panel de actividades</h1>
        <nav>
            <a href="#tareas">Tareas</a>
            <a href="#nuevas">Nuevas Tareas</a>
        </nav>
    </header>
    
    <main>
        <section id="tareas">
            <h2>Tareas de hoy</h2>
            <p>Estas son las tareas pendientes.</p>
    
            <ul class="lista-tareas">
                <li class="tarjeta-actividad">
                    Comprar cafe
                    <span class="badge-prioridad">Alta</span>
                </li>
    
                <li class="tarjeta-actividad">
                    Preparar el informe
                    <span class="badge-prioridad">Media</span>
                </li>
            </ul>
        </section>
    
        <section id="nuevas">
            <h2>Nueva Tarea</h2>
    
            <form action="">
                <label for="titulo">Titulo de la tarea</label>
                <input type="text" id="titulo" required maxlength="80">
    
                <br>
    
                <label for="descripcion">Descripción</label>
                <br>
                <textarea id="descripcion" cols="30" rows="10"></textarea>
    
                <br><br>
    
                <label for="prioridad">Prioridad</label>
                <select id="prioridad">
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                </select>
    
                <br><br>
    
                <button>Crear Tarea</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>Panel de actividades, hecho con HTML</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
